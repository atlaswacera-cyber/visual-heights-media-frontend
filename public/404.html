<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Visual Heights Media</title>
    <script>
      const repositoryPath = "/visual-heights-media-frontend";
      const route = window.location.pathname
        .slice(repositoryPath.length)
        .replace(/^\/?/, "/");

      window.location.replace(
        `${repositoryPath}/?route=${encodeURIComponent(
          route + window.location.search + window.location.hash,
        )}`,
      );
    </script>
  </head>
  <body></body>
</html>
